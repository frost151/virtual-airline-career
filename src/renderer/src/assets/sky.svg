    <ellipse cx="1060" cy="846" rx="470" ry="16" fill="#f6bd85"/>
    <ellipse cx="1660" cy="880" rx="430" ry="22" fill="#d7895c"/>
  </g>
  <path d="M-60 330 Q 760 200 1488 136" stroke="#fff" stroke-opacity="0.22" stroke-width="3" fill="none" filter="url(#trail)"/>
  <path d="M-60 339 Q 760 209 1488 144" stroke="#fff" stroke-opacity="0.12" stroke-width="3" fill="none" filter="url(#trail)"/>
  <g transform="translate(1498 138) rotate(78) scale(0.06) translate(-256 -256)" fill="#eef3fb" opacity="0.7">
    <path d="M256 60 C 274 60 284 84 284 108 L 284 206 L 452 292 L 452 330 L 284 288 L 284 384 L 330 418 L 330 446 L 256 426 L 182 446 L 182 418 L 228 384 L 228 288 L 60 330 L 60 292 L 228 206 L 228 108 C 228 84 238 60 256 60 Z"/>
  </g>
  <path d="M0 928 L120 904 L260 924 L400 878 L520 914 L640 889 L820 934 L980 899 L1120 924 L1260 884 L1420 919 L1580 894 L1760 929 L1920 904 L1920 1080 L0 1080 Z" fill="#1b1727" opacity="0.88"/>
  <path d="M0 982 L180 951 L360 986 L560 956 L760 996 L980 961 L1200 1001 L1420 966 L1640 996 L1920 971 L1920 1080 L0 1080 Z" fill="#0a0911"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
