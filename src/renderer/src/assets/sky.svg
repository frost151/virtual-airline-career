<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Фон интерфейса: закатное небо, облака, инверсионный след, горы. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040915"/>
      <stop offset="0.36" stop-color="#0b1c37"/>
      <stop offset="0.6" stop-color="#21406a"/>
      <stop offset="0.76" stop-color="#6d5b72"/>
      <stop offset="0.85" stop-color="#d4864e"/>
      <stop offset="0.89" stop-color="#f2b36d"/>
      <stop offset="1" stop-color="#2a1c24"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.86" r="0.42">
      <stop offset="0" stop-color="#ffe0a8" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#ffa45e" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="haze" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="soft" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="trail" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <g fill="#fff">
    <circle cx="160" cy="90" r="1.2" opacity="0.6"/><circle cx="420" cy="160" r="0.9" opacity="0.5"/>
    <circle cx="610" cy="60" r="1.1" opacity="0.55"/><circle cx="880" cy="140" r="0.8" opacity="0.4"/>
    <circle cx="1120" cy="70" r="1.3" opacity="0.6"/><circle cx="1360" cy="120" r="0.9" opacity="0.45"/>
    <circle cx="1580" cy="50" r="1.2" opacity="0.55"/><circle cx="1800" cy="150" r="1" opacity="0.5"/>
    <circle cx="260" cy="240" r="0.8" opacity="0.35"/><circle cx="1700" cy="260" r="0.8" opacity="0.35"/>
  </g>
  <g filter="url(#haze)" fill="#9fb7d9" opacity="0.2">
    <ellipse cx="380" cy="390" rx="440" ry="38"/>
    <ellipse cx="1320" cy="320" rx="540" ry="32"/>
    <ellipse cx="880" cy="560" rx="640" ry="52"/>
  </g>
  <g filter="url(#soft)" opacity="0.6">
