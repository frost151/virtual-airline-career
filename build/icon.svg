<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Иконка приложения: золотой самолёт в наборе высоты на тёмно-синем фоне (цвета погон из личного кабинета). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b6e"/>
      <stop offset="1" stop-color="#0d1a33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dd8a"/>
      <stop offset="0.55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8841f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="6"/>
  <!-- След набора высоты. -->
  <path d="M96 404 C 180 392, 250 350, 300 286" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Самолёт сверху, нос вверх, повёрнут на 45° — летит вверх-вправо. -->
  <g transform="translate(326 214) rotate(45) scale(0.62) translate(-256 -256)">
    <path fill="url(#gold)" d="M256 60 C 274 60 284 84 284 108 L 284 206 L 452 292 L 452 330 L 284 288 L 284 384 L 330 418 L 330 446 L 256 426 L 182 446 L 182 418 L 228 384 L 228 288 L 60 330 L 60 292 L 228 206 L 228 108 C 228 84 238 60 256 60 Z"/>
  </g>
</svg>
